<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f2efe5" />
    <title>Josh Westbury — Rebuilding</title>
    <meta
      name="description"
      content="Josh Westbury is rebuilding his personal site. Check back soon."
    />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --paper: #f2efe5;
        --ink: #1d1e1a;
        --muted: #66675f;
        --line: rgba(29, 30, 26, 0.22);
        --blue: #2658d8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 4px;
      }

      .page {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 0 clamp(1.25rem, 4vw, 4rem);
      }

      header,
      footer {
        min-height: 4.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        font-size: 0.72rem;
      }

      header {
        border-bottom: 1px solid var(--line);
      }

      header strong {
        font-size: 0.82rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--muted);
      }

      .status::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--blue);
      }

      main {
        width: min(100%, 82rem);
        margin: auto;
        padding: clamp(5rem, 12vh, 9rem) 0;
      }

      .eyebrow {
        margin: 0 0 2rem;
        color: var(--muted);
        font-family: "Courier New", Courier, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(4rem, 9.5vw, 9rem);
        font-weight: 600;
        letter-spacing: -0.075em;
        line-height: 0.88;
      }

      h1 em {
        color: var(--blue);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
      }

      .note {
        max-width: 31rem;
        margin: clamp(3rem, 7vw, 5.5rem) 0 0 auto;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: clamp(1rem, 1.4vw, 1.2rem);
        line-height: 1.55;
      }

      .note p {
        margin: 0;
      }

      .contact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        margin-top: 1.35rem;
        color: var(--ink);
        font-size: 0.95rem;
        line-height: 1.2;
      }

      .contact-links a {
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--line);
      }

      .contact-links a:hover {
        border-color: var(--ink);
      }

      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
      }

      @media (max-width: 600px) {
        header,
        footer {
          min-height: 4rem;
        }

        main {
          padding: 5rem 0;
        }

        h1 {
          font-size: clamp(3.4rem, 18vw, 4.75rem);
        }

        .note {
          margin-left: 0;
        }

        .contact-links a {
          padding: 0.6rem 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <strong>Josh Westbury</strong>
        <span class="status">Site in progress</span>
      </header>

      <main>
        <p class="eyebrow">Currently</p>
        <h1>I’m rebuilding <em>this site.</em></h1>
        <div class="note">
          <p>I’ll be back here soon. In the meantime, you can find me below.</p>
          <nav class="contact-links" aria-label="Elsewhere">
            <a href="mailto:joshwestbury@gmail.com">Email</a>
            <a href="https://github.com/joshwestbury">GitHub</a>
            <a href="https://x.com/jrwestbury">X</a>
            <a href="https://www.linkedin.com/in/joshwestbury/">LinkedIn</a>
          </nav>
        </div>
      </main>

      <footer>
        <span>McKinney, Texas</span>
      </footer>
    </div>
  </body>
</html>
